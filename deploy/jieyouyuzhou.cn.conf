server {
    listen 80;
    server_name jieyouyuzhou.cn www.jieyouyuzhou.cn;

    # 强制重定向 HTTP 到 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name jieyouyuzhou.cn www.jieyouyuzhou.cn;
    client_max_body_size 25m;

    # SSL 证书配置
    # 请确保将证书文件上传到服务器的 /etc/nginx/ssl/ 目录
    ssl_certificate /etc/nginx/ssl/jieyouyuzhou.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/jieyouyuzhou.cn.key;

    # SSL 优化配置 (可选，提高安全性)
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # 静态资源缓存 (针对 Vite 打包后的 assets)
    location /assets/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # 开启长期缓存
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API 和所有其他请求转发给 Node.js
    location / {
        proxy_pass http://127.0.0.1:8787;
        
        # 必要的代理头
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (Server-Sent Events) 关键配置
        # 必须关闭缓冲，否则客户端收不到流式进度
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s; # 长连接超时时间
    }
}
